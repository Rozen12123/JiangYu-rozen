<script>
$(document).ready(function () {
  var base = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/';
  $.getJSON(base + 'gs_data.json', function (data) {
    if (data && typeof data.citedby !== 'undefined') {
      $('#total_cit').text(data.citedby);
    }
    var pubs = data && data.publications ? Object.values(data.publications) : [];
    function norm(s){ return (s || '').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
    $('.show_paper_citations').each(function(){
      var wanted = norm($(this).attr('data-title'));
      var hit = pubs.find(function(p){ return norm(p && p.bib && p.bib.title) === wanted; });
      if(hit && typeof hit.num_citations !== 'undefined'){
        $(this).text(' | Citations: ' + hit.num_citations);
      }
    });
  });
});
</script>
