name: Update Google Scholar Citations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch Google Scholar
        env:
          GOOGLE_SCHOLAR_ID: "OhbV4CEAAAAJ"
        run: python google_scholar_crawler/main.py
      - name: Publish citation data
        run: |
          cd google_scholar_crawler/results
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Update citation data"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:google-scholar-stats --force
